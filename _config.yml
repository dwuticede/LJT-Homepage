# ---------------------------------------------------------
# Jekyll Academic Pages Configuration
# ---------------------------------------------------------

theme: jekyll-theme-academicpages

# ---------------------------------------------------------
# Site Settings
# ---------------------------------------------------------
title: Junteng Liu
tagline: Junteng Liu - PhD Candidate at HKUST
description: >- # this means to ignore newlines until "baseurl:"
  Personal website of Junteng Liu, first-year PhD candidate at HKUST NLP Group.
  Research focuses on natural language processing and machine learning.
baseurl: "/LJT-Homepage" # the subpath of your site, e.g. "/blog"
url: "https://dwuticede.github.io" # the base hostname & protocol for your site
author:
  name: Junteng Liu
  image: profile.png
  email: jliugi@connect.ust.hk
  github: Vicent0205
  scholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  twitter: junteng88716710
  cv: files/cv.pdf
  address: >-
    Hong Kong University of Science and Technology, Hong Kong

# ---------------------------------------------------------
# Collections
# ---------------------------------------------------------
collections:
  publications:
    output: true
    permalink: /publications/:path/

# ---------------------------------------------------------
# Defaults
# ---------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"

# ---------------------------------------------------------
# Navigation
# ---------------------------------------------------------
# Linking a "mailto:" link will automatically create an envelope icon
# in the navbar. See https://fontawesome.com/icons?d=gallery&s=solid&m=free
# for a list of possible icons.
nav:
  - name: About
    link: /
    icon: home
  - name: Research
    link: /research/
    icon: "microscope"
  - name: Publications
    link: /publications/
    icon: "book"
  - name: Contact
    link: /contact/
    icon: "envelope"
  - name: GitHub
    link: https://github.com/Vicent0205
    icon: "github"
    target: _blank
  - name: Google Scholar
    link: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    icon: "graduation-cap"
    target: _blank
  - name: Email
    link: mailto:jliugi@connect.ust.hk
    icon: "envelope"

# ---------------------------------------------------------
# Build Settings
# ---------------------------------------------------------
# These are flags to ensure the site is configured properly.
markdown: kramdown
highlighter: rouge
permalink: pretty
timezone: Asia/Hong_Kong

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .git
  - .github
  - node_modules
  - package.json
  - package-lock.json
  - Dockerfile
  - docker-compose.yaml
  - .devcontainer
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb

# ---------------------------------------------------------
# Collections Defaults
# ---------------------------------------------------------
# The filters the collection will use on the first iteration.
defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"

# ---------------------------------------------------------
# Social Icons
# ---------------------------------------------------------
social:
  - icon: "envelope"
    link: "mailto:jliugi@connect.ust.hk"
  - icon: "github"
    link: "https://github.com/Vicent0205"
  - icon: "graduation-cap"
    link: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  - icon: "twitter"
    link: "https://twitter.com/junteng88716710"
  - icon: "linkedin"
    link: ""
  - icon: "facebook"
    link: ""
  - icon: "instagram"
    link: ""
  - icon: "youtube"
    link: ""
  - icon: "twitter-square"
    link: ""
  - icon: "linkedin-square"
    link: ""
  - icon: "researchgate"
    link: ""
  - icon: "orcid"
    link: ""
  - icon: "stackoverflow"
    link: ""
  - icon: "bitbucket"
    link: ""
  - icon: "gitlab"
    link: ""
  - icon: "dribbble"
    link: ""
  - icon: "medium"
    link: ""
  - icon: "wiki"
    link: ""
  - icon: "keybase"
    link: ""

# ---------------------------------------------------------
# Teaching
# ---------------------------------------------------------
teaching: false

# ---------------------------------------------------------
# Talks
# ---------------------------------------------------------
talks: false

# ---------------------------------------------------------
# Portfolio
# ---------------------------------------------------------
portfolio: false

# ---------------------------------------------------------
# Pagination
# ---------------------------------------------------------
paginate: 5
paginate_path: "/blog/page:num/"

# ---------------------------------------------------------
# Search
# ---------------------------------------------------------
search: true

# ---------------------------------------------------------
# Analytics
# ---------------------------------------------------------
analytics:
  provider: "google-gtag"
  google:
    tracking_id: ""
    anonymize_ip: false

# ---------------------------------------------------------
# Theme Colors
# ---------------------------------------------------------
# See https://academicpages.github.io/pages/theme-colors.html
skin: "dark"
# If using the "auto" skin, set the default color scheme.
# This will be used when the user's preference is not set.
# See https://academicpages.github.io/pages/theme-colors.html
auto-skin: "light"
# The following options will be ignored if you are not using the auto skin.
dark-skin: "dark"
# If you want to use a different color scheme when the user's preference is dark.

# ---------------------------------------------------------
# Navigation Bar
# ---------------------------------------------------------
# If true, the navigation bar will be sticky.
sticky_nav: true

# ---------------------------------------------------------
# Footer
# ---------------------------------------------------------
footer:
  links:
    - name: GitHub
      icon: "github"
      link: "https://github.com/Vicent0205"
    - name: Google Scholar
      icon: "graduation-cap"
      link: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - name: Email
      icon: "envelope"
      link: "mailto:jliugi@connect.ust.hk"
    - name: Twitter
      icon: "twitter"
      link: "https://twitter.com/junteng88716710"

